<!DOCTYPE html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f7f8fa;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #f7f8fa"
    >
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table
            role="presentation"
            width="420"
            cellpadding="0"
            cellspacing="0"
            style="
              background: #ffffff;
              border: 1px solid #d8dde6;
              border-radius: 12px;
            "
          >
            <tr>
              <td
                style="
                  padding: 40px 32px;
                  font-family:
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    Segoe UI,
                    sans-serif;
                  text-align: center;
                "
              >
                <p
                  style="
                    margin: 0;
                    font-size: 15px;
                    font-weight: 600;
                    color: #1e4d8c;
                  "
                >
                  Seton Spaces
                </p>
                <p
                  style="
                    margin: 28px 0 0;
                    font-size: 36px;
                    letter-spacing: 0.28em;
                    font-weight: 600;
                    color: #1a2332;
                  "
                >
                  {{ .Token }}
                </p>
                <p
                  style="
                    margin: 20px 0 0;
                    font-size: 16px;
                    line-height: 1.5;
                    color: #5c6678;
                  "
                >
                  Enter this code to sign in.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
